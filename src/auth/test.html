<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار تسجيل الدخول - Voxa</title>
</head>
<body>

  <h2>تسجيل الدخول برقم الهاتف</h2>

  <input
    type="text"
    id="phone"
    placeholder="+9677XXXXXXXX"
    style="padding:10px;width:250px;"
  />

  <br><br>

  <button id="send">إرسال رمز التحقق</button>

  <!-- reCAPTCHA -->
  <div id="recaptcha-container"></div>

  <script type="module">
    import { initRecaptcha, sendOTP } from "./index.js";

    initRecaptcha("recaptcha-container");

    document.getElementById("send").onclick = async () => {
      const phone = document.getElementById("phone").value;

      if (!phone) {
        alert("أدخل رقم الهاتف");
        return;
      }

      try {
        const confirmationResult = await sendOTP(phone);
        window.confirmationResult = confirmationResult;
        alert("تم إرسال رمز التحقق (OTP)");
      } catch (e) {
        alert("خطأ: " + e.message);
      }
    };
  </script>

</body>
</html>
