<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول - Voxa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body style="font-family: sans-serif; padding:20px">

  <h2>تسجيل الدخول برقم الهاتف</h2>

  <input
    id="phone"
    type="tel"
    placeholder="+967XXXXXXXXX"
    style="width:100%; padding:10px; margin-bottom:10px"
  />

  <button onclick="sendCode()">إرسال الكود</button>

  <br /><br />

  <input
    id="otp"
    type="text"
    placeholder="أدخل كود OTP"
    style="width:100%; padding:10px; margin-bottom:10px"
  />

  <button onclick="confirmCode()">تأكيد الكود</button>

  <!-- reCAPTCHA -->
  <div id="recaptcha-container"></div>

  <script type="module">
    import {
      startApp,
      loginWithPhone,
      confirmCode
    } from "./index.js";

    // تهيئة Firebase + reCAPTCHA
    startApp();

    window.sendCode = async () => {
      const phone = document.getElementById("phone").value;
      await loginWithPhone(phone);
      alert("تم إرسال الكود");
    };

    window.confirmCode = async () => {
      const code = document.getElementById("otp").value;
      const user = await confirmCode(code);
      alert("تم تسجيل الدخول: " + user.phoneNumber);
    };
  </script>

</body>
</html>
