<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>Voxa Login Test</title>
</head>
<body>

  <h2>تسجيل الدخول - Voxa</h2>

  <input
    id="phone"
    type="tel"
    placeholder="+967XXXXXXXXX"
  />

  <button onclick="sendCode()">إرسال الكود</button>

  <br><br>

  <input
    id="code"
    type="text"
    placeholder="أدخل كود OTP"
  />

  <button onclick="confirm()">تأكيد الكود</button>

  <div id="recaptcha-container"></div>

  <script type="module">
    import { startApp, loginWithPhone, confirmCode } from "./src/app/index.js";

    startApp();

    window.sendCode = async () => {
      const phone = document.getElementById("phone").value;
      await loginWithPhone(phone);
      alert("تم إرسال الكود");
    };

    window.confirm = async () => {
      const code = document.getElementById("code").value;
      const user = await confirmCode(code);
      alert("تم تسجيل الدخول: " + user.phoneNumber);
    };
  </script>

</body>
</html>
